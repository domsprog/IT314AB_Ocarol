version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  provider: ^6.0.5
  postgres: ^3.6.0
  flutter_dotenv: ^6.0.2

